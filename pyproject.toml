[project]
name = "vora"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "sherpa-onnx", "numpy", "scipy", "faiss-cpu", "fastembed", "rank_bm25", "jieba",
  "rapidfuzz", "llama-cpp-python", "fastapi", "uvicorn[standard]", "websockets",
  "pydantic-settings", "psutil", "huggingface_hub", "onnx", "onnxruntime",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-timeout", "httpx"]
eval = ["jiwer", "datasets", "soundfile", "torch", "onnxruntime", "optimum[onnxruntime]", "playwright"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = ["perf: latency/memory tests, need models and real CPU"]
asyncio_mode = "auto"
timeout = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vora"]
